<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>新品日报-vis - 视觉信号追踪</title>
<script src="./products/ks-recent.js"></script>
<script>
  // 最后更新时间 - 每次更新时修改这个值
  window.lastUpdated = '2026-06-12 20:00';
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f1419'/%3E%3Ccircle cx='50' cy='50' r='22' fill='none' stroke='%2322d3ee' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2322d3ee'/%3E%3Cline x1='50' y1='28' x2='50' y2='38' stroke='%2322d3ee' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='50' y1='62' x2='50' y2='72' stroke='%2322d3ee' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='28' y1='50' x2='38' y2='50' stroke='%2322d3ee' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='62' y1='50' x2='72' y2='50' stroke='%2322d3ee' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0f1419;
    --bg-secondary: #1a1f2e;
    --bg-card: #1e2530;
    --bg-card-hover: #252d3a;
    --bg-input: #1e2530;
    --text-primary: #e6e6e6;
    --text-secondary: #8b949e;
    --text-muted: #6b7280;
    --accent-cyan: #22d3ee;
    --accent-cyan-dark: #06b6d4;
    --accent-green: #22c55e;
    --accent-gold: #fbbf24;
    --accent-blue: #3b82f6;
    --accent-purple: #a855f7;
    --accent-pink: #ec4899;
    --accent-red: #ef4444;
    --accent-orange: #f97316;
    --border-color: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* 左侧导航栏 */
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    z-index: 100;
  }

  .logo {
    padding: 0 20px 24px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 16px;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot {
    width: 8px;
    height: 8px;
    background: var(--accent-cyan);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .logo-text span {
    color: var(--accent-cyan);
  }

  .version-badge {
    font-size: 10px;
    background: var(--accent-cyan);
    color: var(--bg-primary);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 4px;
  }

  .nav-menu {
    flex: 1;
    padding: 0 12px;
    overflow-y: auto;
    padding-bottom: 50px; /* 为底部更新时间留空间 */
  }

  .nav-section-label {
    padding: 14px 16px 6px;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .nav-section-group {
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
  }

  .nav-section-group .nav-item {
    margin-left: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 8px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s ease;
    margin-bottom: 4px;
    cursor: pointer;
    position: relative;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.04);
    color: var(--text-primary);
  }

  .nav-item.active {
    background: rgba(34, 211, 238, 0.1);
    color: var(--accent-cyan);
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    background: var(--accent-cyan);
    border-radius: 0 2px 2px 0;
  }

  /* 品牌管理折叠 */
  .nav-collapsible {
    margin-top: 4px;
  }
  .nav-arrow {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.2s;
  }
  .nav-arrow.open {
    transform: rotate(90deg);
  }
  .nav-collapsible-content {
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    margin: 4px 8px;
    max-height: 400px;
    overflow-y: auto;
  }
  .brand-inline-actions {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .brand-inline-btn {
    flex: 1;
    padding: 4px 8px;
    font-size: 11px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .brand-inline-btn:hover {
    background: var(--accent-cyan);
    color: var(--bg-primary);
    border-color: var(--accent-cyan);
  }
  .brand-inline-search input {
    width: 100%;
    padding: 6px 10px;
    font-size: 12px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-primary);
    outline: none;
    margin-bottom: 8px;
    box-sizing: border-box;
  }
  .brand-inline-search input:focus {
    border-color: var(--accent-cyan);
  }
  .brand-inline-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand-inline-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: default;
    transition: background 0.15s;
  }
  .brand-inline-item:hover {
    background: rgba(255,255,255,0.05);
  }
  .brand-inline-item .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .brand-inline-item .brand-remove {
    margin-left: auto;
    opacity: 0;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 14px;
    transition: opacity 0.15s;
  }
  .brand-inline-item:hover .brand-remove {
    opacity: 1;
  }
  .brand-inline-item .brand-remove:hover {
    color: #ef4444;
  }

  /* 侧边栏底部更新时间 */
  .sidebar-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    border-top: 1px solid var(--border-color);
    background: var(--bg-secondary);
  }
  .sidebar-update-time {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .nav-icon {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .nav-badge {
    margin-left: auto;
    font-size: 11px;
    background: var(--accent-red);
    color: white;
    padding: 2px 6px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
  }

  /* 第二列侧边栏 - 品牌管理 */
  .brand-panel {
    position: fixed;
    left: 240px;
    top: 0;
    width: 280px;
    height: 100vh;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    z-index: 99;
  }

  .brand-panel-header {
    padding: 0 16px 12px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 12px;
  }

  .brand-panel-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .brand-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    background: rgba(255,255,255,0.06);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .brand-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .brand-btn {
    flex: 1;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .brand-btn-primary {
    background: var(--accent-cyan);
    color: var(--bg-primary);
  }

  .brand-btn-primary:hover {
    opacity: 0.9;
  }

  .brand-btn-secondary {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
  }

  .brand-btn-secondary:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  .brand-sync-status {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .brand-sync-status.synced {
    color: var(--accent-green);
  }

  .brand-sync-status.syncing::before {
    content: '';
    width: 10px;
    height: 10px;
    border: 2px solid var(--accent-cyan);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .brand-search {
    margin: 8px 16px;
    padding: 8px 12px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 13px;
    width: calc(100% - 32px);
    outline: none;
    transition: border-color 0.2s;
  }

  .brand-search::placeholder {
    color: var(--text-muted);
  }

  .brand-search:focus {
    border-color: var(--accent-cyan);
  }

  .brand-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }

  .brand-category-label {
    padding: 8px 8px 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .brand-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 2px;
  }

  .brand-item:hover {
    background: rgba(255,255,255,0.04);
  }

  .brand-item:hover .brand-actions-inline {
    opacity: 1;
  }

  .brand-item.disabled {
    opacity: 0.4;
  }

  .brand-toggle {
    width: 32px;
    height: 18px;
    background: var(--border-color);
    border-radius: 9px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .brand-toggle.active {
    background: var(--accent-cyan);
  }

  .brand-toggle::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: transform 0.2s;
  }

  .brand-toggle.active::after {
    transform: translateX(14px);
  }

  .brand-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .brand-info {
    flex: 1;
    min-width: 0;
  }

  .brand-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-type {
    font-size: 10px;
    color: var(--text-muted);
  }

  .brand-actions-inline {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .brand-action-btn {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-action-btn:hover {
    background: rgba(239, 68, 68, 0.15);
    color: var(--accent-red);
  }

  /* 主内容区 */
  .main-content {
    margin-left: 240px;
    min-height: 100vh;
    padding: 24px 32px;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .page-title-group {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .page-title {
    font-size: 24px;
    font-weight: 700;
  }

  .page-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .notification-btn {
    padding: 10px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }

  .notification-btn:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  .notification-btn.enabled {
    background: rgba(34, 211, 238, 0.1);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  /* 筛选栏 */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .filter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-tab {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    background: transparent;
    color: var(--text-secondary);
  }

  .filter-tab:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
  }

  .filter-tab.active {
    background: var(--accent-cyan);
    color: var(--bg-primary);
  }

  .search-box {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }

  .search-input {
    padding: 8px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14px;
    width: 240px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input::placeholder {
    color: var(--text-muted);
  }

  .search-input:focus {
    border-color: var(--accent-cyan);
  }

  .search-btn {
    padding: 8px 16px;
    background: var(--accent-cyan);
    border: none;
    border-radius: 8px;
    color: var(--bg-primary);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .search-btn:hover {
    opacity: 0.9;
  }

  /* 时间轴 */
  .timeline {
    position: relative;
    padding-left: 80px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 60px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border-color);
  }

  .date-group {
    margin-bottom: 32px;
  }

  .date-label {
    position: relative;
    left: -80px;
    width: 80px;
    text-align: right;
    padding-right: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  /* ===== 骨架屏 ===== */
  .skeleton-card {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    animation: skeleton-pulse 1.5s ease-in-out infinite;
  }
  .skeleton-line {
    height: 14px;
    background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-card-hover) 50%, var(--bg-secondary) 75%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.5s ease-in-out infinite;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .skeleton-line.short { width: 60%; }
  .skeleton-line.medium { width: 80%; }
  .skeleton-line.long { width: 95%; }
  @keyframes skeleton-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  @keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ===== 焦点样式 ===== */
  :focus-visible {
    outline: 2px solid var(--accent-cyan);
    outline-offset: 2px;
  }
  .nav-item:focus-visible, .filter-tab:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent-cyan);
    outline-offset: 2px;
  }

  /* ===== 搜索高亮 ===== */
  .highlight {
    background: var(--accent-cyan);
    color: var(--bg-primary);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* ===== 排序按钮 ===== */
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sort-btn {
    padding: 6px 12px;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sort-btn:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }
  .sort-btn.active {
    background: var(--accent-cyan);
    color: var(--bg-primary);
    border-color: var(--accent-cyan);
  }

  /* ===== 错误提示 ===== */
  .error-toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent-red);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideUp 0.3s ease;
  }
  .error-toast .retry-btn {
    background: white;
    color: var(--accent-red);
    border: none;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }

  /* ===== 移动端底部导航 ===== */
  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-color);
    padding: 8px 0;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 100;
  }
  .mobile-nav-items {
    display: flex;
    justify-content: space-around;
  }
  .mobile-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 10px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .mobile-nav-item.active {
    color: var(--accent-cyan);
  }
  .mobile-nav-item svg {
    width: 20px;
    height: 20px;
  }

  /* 卡片样式 */
  .card {
    position: relative;
    display: grid;
    grid-template-columns: minmax(180px, 260px) minmax(0, 1fr);
    gap: 18px;
    align-items: start;
    background: var(--bg-card);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    transition: all 0.2s;
    border: 1px solid transparent;
  }

  .card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
  }

  .card.duplicate {
    opacity: 0.6;
    border-left: 3px solid var(--accent-orange);
  }

  .card-time {
    position: absolute;
    left: -80px;
    width: 50px;
    text-align: right;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  .card-time::after {
    content: '';
    position: absolute;
    right: -26px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    background: var(--accent-cyan);
    border-radius: 50%;
    border: 2px solid var(--bg-primary);
  }

  .card-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    height: auto;
    min-height: 210px;
    background: #f3f6f8;
    border-radius: 8px;
    margin-bottom: 0;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;
    transition: transform 0.3s;
  }

  .card:hover .card-image img {
    transform: scale(1.02);
  }

  .card-image-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  .card-content {
    min-width: 0;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .card-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .card-source {
    flex: 1;
  }

  .card-source-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .card-source-type {
    font-size: 12px;
    color: var(--text-muted);
  }

  .card-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge-featured {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: linear-gradient(135deg, var(--accent-gold), #f59e0b);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--bg-primary);
  }

  .badge-score {
    padding: 4px 10px;
    background: rgba(34, 211, 238, 0.15);
    border: 1px solid rgba(34, 211, 238, 0.3);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-cyan);
  }

  .badge-source {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }

  .badge-source-official {
    background: rgba(34, 197, 94, 0.15);
    color: var(--accent-green);
  }

  .badge-source-media {
    background: rgba(59, 130, 246, 0.15);
    color: var(--accent-blue);
  }

  .badge-source-secondary {
    background: rgba(107, 114, 128, 0.15);
    color: var(--text-muted);
  }

  .card-title {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .card-title a {
    color: var(--text-primary);
    text-decoration: none;
    transition: color 0.2s;
  }

  .card-title a:hover {
    color: var(--accent-cyan);
  }

  .card-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 12px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .tag {
    padding: 4px 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .tag-cyan { background: rgba(34, 211, 238, 0.1); color: var(--accent-cyan); }
  .tag-green { background: rgba(34, 197, 94, 0.1); color: var(--accent-green); }
  .tag-blue { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
  .tag-purple { background: rgba(168, 85, 247, 0.1); color: var(--accent-purple); }
  .tag-pink { background: rgba(236, 72, 153, 0.1); color: var(--accent-pink); }
  .tag-orange { background: rgba(249, 115, 22, 0.1); color: var(--accent-orange); }

  .card-reason {
    padding: 12px 16px;
    background: rgba(34, 197, 94, 0.08);
    border-left: 3px solid var(--accent-green);
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .card-reason strong {
    color: var(--accent-green);
    font-weight: 600;
  }

  .score-breakdown {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    font-size: 11px;
  }

  .score-item {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
  }

  .score-item-value {
    color: var(--accent-cyan);
    font-weight: 600;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
  }

  .card-meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .card-link {
    font-size: 12px;
    color: var(--accent-cyan);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-link:hover {
    text-decoration: underline;
  }

  .duplicate-notice {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: rgba(249, 115, 22, 0.1);
    border-radius: 6px;
    font-size: 12px;
    color: var(--accent-orange);
    margin-bottom: 12px;
  }

  .duplicate-toggle {
    margin-left: auto;
    font-size: 11px;
    color: var(--accent-cyan);
    cursor: pointer;
  }

  /* 页脚统计 */
  .footer-stats {
    display: flex;
    justify-content: center;
    gap: 48px;
    padding: 32px;
    border-top: 1px solid var(--border-color);
    margin-top: 40px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .footer-text {
    text-align: center;
    padding: 16px;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* 弹窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 28px;
    width: 420px;
    max-width: 90vw;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--text-primary);
  }

  .modal-field {
    margin-bottom: 16px;
  }

  .modal-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .modal-input, .modal-select {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .modal-input:focus, .modal-select:focus {
    border-color: var(--accent-cyan);
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 24px;
  }

  .modal-btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-family: inherit;
  }

  .modal-btn-cancel {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
  }

  .modal-btn-confirm {
    background: var(--accent-cyan);
    color: var(--bg-primary);
  }

  /* 通知 */
  .notification-toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 2000;
    transform: translateX(400px);
    transition: transform 0.3s ease;
    max-width: 360px;
  }

  .notification-toast.show {
    transform: translateX(0);
  }

  .notification-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-gold), #f59e0b);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .notification-content {
    flex: 1;
  }

  .notification-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .notification-text {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* 响应式 */
  @media (max-width: 1200px) {
    .brand-panel {
      display: none;
    }
    .main-content {
      margin-left: 240px;
    }
  }

  @media (max-width: 1024px) {
    .sidebar {
      width: 200px;
    }
    .main-content {
      margin-left: 200px;
      padding: 20px;
    }
    .timeline {
      padding-left: 60px;
    }
    .card-time {
      left: -60px;
      width: 40px;
      font-size: 14px;
    }
  }

  @media (max-width: 768px) {
    .sidebar {
      display: none;
    }
    .main-content {
      margin-left: 0;
      padding: 16px;
      padding-bottom: 80px; /* 为底部导航留空间 */
    }
    .timeline {
      padding-left: 0;
    }
    .timeline::before {
      display: none;
    }
    .card-time {
      position: static;
      width: auto;
      text-align: left;
      margin-bottom: 8px;
      font-size: 11px;
    }
    .card {
      display: block;
    }
    .card-image {
      min-height: 220px;
      margin-bottom: 16px;
    }
    .mobile-nav {
      display: block;
    }
    .filter-bar {
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 6px 10px;
      font-size: 11px;
    }
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
</head>
<body>

<!-- 左侧导航栏 -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-text">新品日报<span>-vis</span><div class="logo-dot"></div></div>
    <div style="font-size: 10px; color: var(--text-muted); padding: 4px 20px 0;">视觉信号追踪</div>
  </div>
  
  <nav class="nav-menu">
    <div class="nav-section-label">每日新品日报</div>
    <div class="nav-section-group">
      <a class="nav-item active" onclick="switchSection('featured', this)">
        <span class="nav-icon">⭐</span>
        精选
        <span class="nav-badge" id="featuredCount">-</span>
      </a>
      <a class="nav-item" onclick="switchSection('all', this)">
        <span class="nav-icon">📋</span>
        全部动态
        <span class="nav-badge" id="allCount">-</span>
      </a>
      <a class="nav-item" onclick="switchSection('today', this)">
        <span class="nav-icon">📅</span>
        今日更新
        <span class="nav-badge" id="todayCount" style="display:none;">0</span>
      </a>
    </div>
    <div class="nav-section-label">众筹分支</div>
    <a class="nav-item" onclick="switchSection('crowdfunding', this)">
      <span class="nav-icon">🔥</span>
      众筹追踪
      <span class="nav-badge" id="crowdfundingCount" style="display:none;">0</span>
    </a>
    <!-- 品牌管理 - 折叠式 -->
    <div class="nav-collapsible" id="brandManagerToggle">
      <a class="nav-item" onclick="toggleBrandManager()">
        <span class="nav-icon">🏷️</span>
        品牌管理
        <span class="nav-badge" id="brandCountNav">-</span>
        <span class="nav-arrow" id="brandArrow">▸</span>
      </a>
      <div class="nav-collapsible-content" id="brandManagerContent" style="display:none;">
        <div class="brand-inline-actions">
          <button class="brand-inline-btn" onclick="openAddBrandModal()">+ 添加</button>
          <button class="brand-inline-btn" onclick="saveBrands()">保存</button>
        </div>
        <div class="brand-inline-search">
          <input type="text" placeholder="搜索品牌..." id="brandSearchInline" oninput="filterBrandList()">
        </div>
        <div class="brand-inline-list" id="brandInlineList">
          <!-- 品牌列表由JS渲染 -->
        </div>
      </div>
    </div>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-update-time">🕐 <span id="sidebarUpdateTime">加载中...</span></div>
  </div>
</aside>

<!-- 第二列侧边栏 - 品牌管理（已移至左侧导航折叠） -->
<aside class="brand-panel" style="display:none;">
  <div class="brand-panel-header">
    <div class="brand-panel-title">
      品牌管理
      <span class="brand-count" id="brandCount">0</span>
    </div>
    <div class="brand-actions">
      <button class="brand-btn brand-btn-primary" onclick="saveBrandsToFile()">
        💾 保存配置
      </button>
      <button class="brand-btn brand-btn-secondary" onclick="loadBrandsFromFile()">
        🔄 刷新
      </button>
    </div>
    <div class="brand-sync-status" id="syncStatus">
      等待同步...
    </div>
  </div>
  
  <input type="file" id="brandFileInput" accept=".json" style="display:none;" onchange="handleFileSelect(event)">
  
  <input type="text" class="brand-search" placeholder="搜索品牌…" oninput="filterBrands(this.value)">

  <div class="brand-list" id="brandList">
    <!-- 品牌列表将通过JS动态加载 -->
  </div>
</aside>

<!-- 主内容区 -->
<main class="main-content">
  <header class="page-header">
    <div class="page-title-group">
      <h1 class="page-title" id="pageTitle">精选</h1>
      <span class="page-subtitle">视觉信号追踪 - 追踪改变消费电子视觉约束的源头</span>
    </div>
    <button class="notification-btn" id="notifyBtn" onclick="toggleNotification()">
      🔔 开启新品提醒
    </button>
  </header>

  <div class="filter-bar">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" onclick="filterCategory(this, 'all')">全部</button>
      <button class="filter-tab" onclick="filterCategory(this, 'car')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-3h8l2 3h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2M5 17a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2M15 17a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2M9 9h1M14 9h1"/></svg> 汽车</button>
      <button class="filter-tab" onclick="filterCategory(this, 'phone')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg> 手机/平板</button>
      <button class="filter-tab" onclick="filterCategory(this, 'wearable')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><polyline points="12 9 12 12 13.5 13.5"/><path d="M16.51 17.35l-.35 3.83a2 2 0 0 1-2 1.82H9.83a2 2 0 0 1-2-1.82l-.35-3.83m.01-10.7l.35-3.83A2 2 0 0 1 9.83 1h4.35a2 2 0 0 1 2 1.82l.35 3.83"/></svg> 可穿戴</button>
      <button class="filter-tab" onclick="filterCategory(this, 'audio')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg> 音频</button>
      <button class="filter-tab" onclick="filterCategory(this, 'mobility')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/></svg> 出行工具</button>
      <button class="filter-tab" onclick="filterCategory(this, 'smart')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> 智能家居</button>
      <button class="filter-tab" onclick="filterCategory(this, 'accessory')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> 充电配件</button>
      <button class="filter-tab" onclick="filterCategory(this, 'camera')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> 影像设备</button>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" placeholder="搜索标题/摘要…" id="searchInput">
      <button class="search-btn" onclick="searchContent()">搜索</button>
    </div>
  </div>

  <!-- 排序栏 -->
  <div class="sort-bar">
    <span style="font-size:12px;color:var(--text-muted);">排序：</span>
    <button class="sort-btn active" onclick="sortProducts('time', this)" data-sort="time">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> 时间
    </button>
    <button class="sort-btn" onclick="sortProducts('score', this)" data-sort="score">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> 评分
    </button>
    <button class="sort-btn" onclick="sortProducts('brand', this)" data-sort="brand">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg> 品牌
    </button>
  </div>

  <!-- 时间轴内容 -->
  <div class="timeline" id="timeline">
    <!-- 内容将通过JS动态加载 -->
  </div>

  <!-- 加载历史归档 -->
  <div id="archiveSection" style="text-align:center;padding:20px 0;display:none;">
    <button id="loadArchiveBtn" onclick="loadArchive()" style="padding:10px 24px;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.2s;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      加载历史归档数据
    </button>
    <div id="archiveStatus" style="font-size:12px;color:var(--text-muted);margin-top:8px;"></div>
  </div>

  <!-- 页脚统计 -->
  <footer class="footer-stats">
    <div class="stat-item">
      <div class="stat-num" id="statTotal">-</div>
      <div class="stat-label" id="statTotalLabel">视觉约束信号</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statFeatured">-</div>
      <div class="stat-label" id="statFeaturedLabel">精选推荐</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statBrands">-</div>
      <div class="stat-label" id="statBrandsLabel">覆盖品牌</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statMonitored">-</div>
      <div class="stat-label" id="statMonitoredLabel">监控中</div>
    </div>
  </footer>
  <p class="footer-text">

async function loadCrowdfundingProducts() {
  if (crowdfundingLoaded) return crowdfundingData;

  try {
    crowdfundingLoadError = '';
    const response = await fetch('./products/ks-recent.json');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    crowdfundingData = Array.isArray(data) ? data : (Array.isArray(data.products) ? data.products : []);
    crowdfundingData = crowdfundingData.map(normalizeCrowdfundingProduct);
    crowdfundingLoaded = true;

    const badge = document.getElementById('crowdfundingCount');
    if (badge) {
      badge.textContent = crowdfundingData.length;
      badge.style.display = crowdfundingData.length ? '' : 'none';
    }
    console.log(`[BrandPulse] 已从 ks-recent.json 加载 ${crowdfundingData.length} 个众筹项目`);
  } catch (e) {
    const fallbackData = window.__crowdfundingData;
    if (fallbackData && Array.isArray(fallbackData.products)) {
      crowdfundingLoadError = '';
      crowdfundingData = fallbackData.products.map(normalizeCrowdfundingProduct);
      crowdfundingLoaded = true;

      const badge = document.getElementById('crowdfundingCount');
      if (badge) {
        badge.textContent = crowdfundingData.length;
        badge.style.display = crowdfundingData.length ? '' : 'none';
      }
      console.log(`[BrandPulse] 已从 ks-recent.js 加载 ${crowdfundingData.length} 个众筹项目`);
    } else {
      console.warn('[BrandPulse] 无法加载 ks-recent.json:', e.message);
      crowdfundingLoadError = e.message || '数据加载失败';
      crowdfundingData = [];
      crowdfundingLoaded = true;
    }
  }

  return crowdfundingData;
}

function normalizeCrowdfundingProduct(product) {
  const ks = product.ksData || {};
  const toNumber = (value) => {
    const number = Number(value);
    return Number.isFinite(number) ? number : 0;
  };
  const usdPledged = toNumber(ks.usdPledged);
  const goal = toNumber(ks.usdGoal || ks.goal);
  const percentFunded = toNumber(ks.percentFunded) || (goal > 0 ? Math.round((usdPledged / goal) * 100) : 0);

  return {
    ...product,
    source: 'kickstarter',
    sourceName: 'Kickstarter',
    ksData: {
      ...ks,
      usdPledged,
      goal: toNumber(ks.goal),
      usdGoal: goal,
      backersCount: toNumber(ks.backersCount),
      percentFunded,
      daysSinceLaunch: toNumber(ks.daysSinceLaunch)
    }
  };
}

        <div class="brand-item" data-name="${brand.name}">
          <div class="brand-avatar" style="background: linear-gradient(135deg, ${color[0]}, ${color[1]});">${initial}</div>
          <div class="brand-info">
            <div class="brand-name">${brand.name}</div>
            <div class="brand-type">${brand.type}</div>
          </div>
          <div class="brand-actions-inline">
            <button class="brand-action-btn" onclick="removeBrand('${brand.name}')" title="移除">×</button>
          </div>
        </div>
      `;
    });
  }
  
  list.innerHTML = html;
  document.getElementById('brandCount').textContent = brandsData.brands.length;
  
  const monitoredCount = brandsData.brands.filter(b => b.monitored).length;

function updateSyncStatus(status) {
  const el = document.getElementById('syncStatus');
  el.textContent = status;
  el.className = 'brand-sync-status';
  if (status === '已同步') {
    el.classList.add('synced');
  } else if (status === '同步中...') {
    el.classList.add('syncing');
  }
}

// ==================== 文件操作 ====================
function saveBrandsToFile() {
  updateSyncStatus('同步中...');
  
  const dataStr = JSON.stringify(brandsData, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = 'brands.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  setTimeout(() => {
    updateSyncStatus('已同步');
  }, 1000);
}

function loadBrandsFromFile() {
  document.getElementById('brandFileInput').click();
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.brands && Array.isArray(data.brands)) {
        brandsData = {...brandsData, ...data};
        renderBrandList();
        updateSyncStatus('已同步');
        alert('品牌配置已加载！');
      } else {
        alert('配置文件格式错误！');
      }
    } catch (err) {
      alert('文件解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

function filterBrands(keyword) {
  const items = document.querySelectorAll('.brand-item');
  keyword = keyword.toLowerCase();
  
  items.forEach(item => {
    const name = item.querySelector('.brand-name').textContent.toLowerCase();
    const type = item.querySelector('.brand-type').textContent.toLowerCase();
    item.style.display = (name.includes(keyword) || type.includes(keyword)) ? '' : 'none';
  });
}

// ==================== 产品展示 ====================
function renderTimeline(productsToRender) {
  const timeline = document.getElementById('timeline');
  const products = productsToRender || productsData;
  
  // 按日期分组
  const groups = {};
  products.forEach(product => {
    const date = (product.time || product.ksData?.launchDate || '未知日期').split(' ')[0];
    if (!groups[date]) groups[date] = [];
    groups[date].push(product);
  });
  
  // 按日期排序（最新的在前）
  const sortedDates = Object.keys(groups).sort((a, b) => {
    const parseDate = (str) => {
      const parts = str.split('-');
      if (parts.length === 3 && (parts[2] === '00' || parts[2] === '0')) {
        return new Date(`${parts[0]}-${parts[1]}-01`);
      }
      return new Date(str);
    };
    return parseDate(b) - parseDate(a);
  });
  
  let html = '';
  sortedDates.forEach(date => {
    const dateProducts = groups[date];
    html += `<div class="date-group" data-date="${date}">`;
    html += `<div class="date-label">${formatDate(date)}</div>`;
    dateProducts.forEach(product => { html += renderProductCard(product); });
    html += '</div>';
  });
  
  timeline.innerHTML = html;
  if (products.length === 0) showEmptyState(true, getEmptyStateMessage());
  else showEmptyState(false);
}

function renderProductCard(product) {
  if (product.source === 'kickstarter' || product.sourceName === 'Kickstarter' || product.ksData) {
    return renderCrowdfundingCard(product);
  }

  const time = (product.time || '').split(' ')[1] || '--:--';
  
  // 审核状态标签
  const getReviewStatusBadge = () => {
    const status = product.reviewStatus || 'needs_review';
    const statusMap = {
      'verified': { text: '✓ 已验证', class: 'badge-verified', color: '#22c55e' },
      'needs_image': { text: '⚠ 待补图', class: 'badge-needs-image', color: '#fbbf24' },
      'needs_source': { text: '⚠ 待补源', class: 'badge-needs-source', color: '#f97316' },
      'needs_review': { text: '⏳ 待复核', class: 'badge-needs-review', color: '#ef4444' },
      'rejected': { text: '✗ 已拒绝', class: 'badge-rejected', color: '#6b7280' }

    const s = statusMap[status] || statusMap['needs_review'];
    return `<span class="badge-review ${s.class}" style="background: ${s.color}20; color: ${s.color}; border: 1px solid ${s.color}40;">${s.text}</span>`;
  };
  
  // 可信度徽章颜色
  const getConfidenceColor = (conf) => {
    if (conf >= 80) return '#22c55e';

    if (status === 'needs_image' || !product.image) {

      </div>`;

  // 约束变化（核心展示）

    `<div class="constraint-change" style="margin: 12px 0; padding: 10px 12px; background: rgba(168, 85, 247, 0.08); border-left: 3px solid var(--accent-purple); border-radius: 0 6px 6px 0;">
      <div style="font-size: 11px; color: var(--accent-purple); font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;">视觉约束变化</div>
      <div style="font-size: 13px; color: var(--text-primary); line-height: 1.5;">${product.constraintChange}</div>
    </div>` : '';
  
  // 证据数量
  const evidenceCount = product.evidence?.length || 0;
  
  // 详情折叠区域
  const detailsHtml = `
    <div class="card-details" style="display:none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
      <div class="card-desc" style="margin-bottom: 12px; font-size: 13px; color: var(--text-secondary);">${product.desc || product.summary || ''}</div>
      
      ${product.facts?.length ? `
        <div style="margin-bottom: 12px;">
          <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500;">事实要点</div>
          <ul style="margin: 0; padding-left: 16px; font-size: 12px; color: var(--text-secondary);">
            ${product.facts.map(f => `<li style="margin-bottom: 4px;">${f}</li>`).join('')}
          </ul>
        </div>
      ` : ''}
      
      ${product.analysis ? `
        <div style="margin-bottom: 12px;">
          <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500;">分析</div>
          ${product.analysis.whyItMatters ? `<div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;"><strong style="color: var(--text-primary);">重要性：</strong>${product.analysis.whyItMatters}</div>` : ''}
          ${product.analysis.transferability ? `<div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;"><strong style="color: var(--text-primary);">可迁移性：</strong>${product.analysis.transferability}</div>` : ''}
          ${product.analysis.risk ? `<div style="font-size: 12px; color: var(--text-secondary);"><strong style="color: var(--text-primary);">风险：</strong>${product.analysis.risk}</div>` : ''}
        </div>
      ` : ''}
      
      ${product.evidence?.length ? `
        <div style="margin-bottom: 12px;">
          <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500;">证据链 (${evidenceCount}条)</div>
          ${product.evidence.map(e => `
            <div style="font-size: 11px; margin-bottom: 6px; padding: 6px 8px; background: var(--bg-secondary); border-radius: 4px;">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
                <span style="color: ${e.tier?.includes('tier0') ? '#22c55e' : e.tier?.includes('tier1') ? '#3b82f6' : '#8b949e'};">●</span>
                <a href="${e.url}" target="_blank" style="color: var(--accent-cyan); text-decoration: none; font-weight: 500;">${e.name}</a>
              </div>
              <div style="color: var(--text-muted); padding-left: 14px;">${e.supports?.join(' · ') || ''}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      
      <div class="card-footer" style="margin-top: 12px;">
        <span class="card-meta">发布时间：${product.time}</span>
        ${product.primarySource?.url ? `<a href="${product.primarySource.url}" target="_blank" class="card-link">查看主来源 →</a>` : ''}
      </div>
    </div>
  `;
  
  return `

        ${getImageArea()}

      <div class="card-content">

          <div class="card-source-type">${getCategoryName(product.category)} · ${time}</div>
        </div>
        <div class="card-badges">
          ${((product.score >= 75) || (product.visTotal >= 7)) ? '<span class="badge-featured">⭐ 精选</span>' : ''}
          ${getReviewStatusBadge()}

      ${constraintChangeHtml}

        <div style="display: flex; align-items: center; gap: 6px;">

function renderCrowdfundingCard(product) {
  const ks = product.ksData || {};
  const time = (product.time || '').split(' ')[1] || '--:--';
  const score = product.score || product.visTotal || 0;
  const state = ks.state || 'unknown';
  const stateText = state === 'live' ? '进行中' : state === 'successful' ? '已成功' : state;
  const isLive = state === 'live';
  const isStaffPick = Boolean(ks.staffPick);
  const backers = Number(ks.backersCount || 0);
  const pledged = Number(ks.usdPledged || 0);
  const goal = Number(ks.usdGoal || ks.goal || 0);
  const percentFunded = Number(ks.percentFunded || (goal > 0 ? Math.round((pledged / goal) * 100) : 0));
  const daysSinceLaunch = Number(ks.daysSinceLaunch || 0);
  const categoryName = getCategoryName(product.category);

  const formatMoney = (value) => {
    const amount = Number(value || 0);
    if (amount >= 1000000) return `$${(amount / 1000000).toFixed(1)}M`;
    if (amount >= 1000) return `$${(amount / 1000).toFixed(1)}K`;
    return `$${Math.round(amount).toLocaleString()}`;
  };

  const imageHtml = product.image ?
    `<img src="${product.image}" alt="${product.title || 'Kickstarter project'}" loading="lazy" onclick="window.open('${product.url || '#'}','_blank')" style="cursor:pointer;" onerror="this.outerHTML='<div class=\\'card-image-placeholder\\' style=\\'background:rgba(34,197,94,.08);border:2px dashed rgba(34,197,94,.25);\\'><div style=\\'font-size:28px;margin-bottom:4px;\\'>🔥</div><div style=\\'font-size:11px;color:#22c55e;font-weight:500;\\'>Kickstarter</div></div>';">` :
    `<div class="card-image-placeholder" style="background:rgba(34,197,94,.08);border:2px dashed rgba(34,197,94,.25);">
      <div style="font-size:28px;margin-bottom:4px;">🔥</div>
      <div style="font-size:11px;color:#22c55e;font-weight:500;">Kickstarter</div>
    </div>`;

  const detailsHtml = `
    <div class="card-details" style="display:none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
      <div class="card-desc" style="margin-bottom: 12px; font-size: 13px; color: var(--text-secondary);">${product.desc || product.summary || ''}</div>
      <div style="margin-bottom: 12px;">
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500;">众筹数据</div>
        <ul style="margin: 0; padding-left: 16px; font-size: 12px; color: var(--text-secondary);">
          <li style="margin-bottom: 4px;">目标金额：${formatMoney(goal)} ${ks.currency || 'USD'}</li>
          <li style="margin-bottom: 4px;">已筹金额：${formatMoney(pledged)} USD</li>
          <li style="margin-bottom: 4px;">达成率：${percentFunded.toLocaleString()}%</li>
          <li style="margin-bottom: 4px;">支持者：${backers.toLocaleString()} 人</li>
          <li style="margin-bottom: 4px;">上线天数：${daysSinceLaunch} 天</li>
          <li style="margin-bottom: 4px;">项目状态：${stateText}</li>
        </ul>
      </div>
      ${product.reason ? `<div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;">${product.reason}</div>` : ''}
      <div class="card-footer" style="margin-top: 12px;">
        <span class="card-meta">上线时间：${product.time || '未知'}</span>
        ${product.url ? `<a href="${product.url}" target="_blank" class="card-link">查看 Kickstarter →</a>` : ''}
      </div>
    </div>
  `;

  return `
    <div class="card crowdfunding-card" data-category="${state}" data-product-id="${product.id || ''}">
      <div class="card-image">
        ${imageHtml}
      </div>
      <div class="card-content">
        <div class="card-header" style="margin-top: 12px;">
          <div class="card-avatar" style="background: linear-gradient(135deg, #22c55e, #16a34a);">${(product.brand || '?').charAt(0)}</div>
          <div class="card-source">
            <div class="card-source-name">${product.brand || '未知品牌'}</div>
            <div class="card-source-type">${categoryName} · ${time}</div>
          </div>
          <div class="card-badges">
            <span class="badge-featured" style="background:${isLive ? 'rgba(34,197,94,.14)' : 'rgba(59,130,246,.14)'};color:${isLive ? '#22c55e' : '#60a5fa'};">${stateText}</span>
            ${isStaffPick ? '<span class="badge-featured" style="background:rgba(251,191,36,.14);color:#fbbf24;">Staff Pick</span>' : ''}
          </div>
        </div>

        <h3 class="card-title" style="font-size: 15px; margin: 10px 0 8px;">${product.title || '无标题项目'}</h3>

        <div style="display: flex; align-items: center; gap: 12px; margin: 12px 0; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 20px; font-weight: 700; color: #22c55e;">${score}</span>

function formatDate(dateStr) {
  // 处理无效日期格式 (如 2026-09-00)
  const parts = dateStr.split('-');
  if (parts.length === 3) {
    const year = parts[0];
    const month = parseInt(parts[1]) || 1;
    const day = parseInt(parts[2]) || 1;
    // 如果日期是00，显示为月份
    if (parts[2] === '00' || parts[2] === '0') {
      return `${year}年${month}月`;
    }
    return `${month}月${day}日`;
  }
  const date = new Date(dateStr);
  if (isNaN(date.getTime())) {
    return dateStr;
  }
  const month = date.getMonth() + 1;
  const day = date.getDate();
  return `${month}月${day}日`;
}

// ==================== 统一状态管理 ====================
const viewState = {
  category: 'all',
  sortBy: 'time',
  search: '',
  section: 'all'
};

function isCrowdfundingView() {
  return viewState.section === 'crowdfunding';
}

function getActiveProducts() {
  return isCrowdfundingView() ? crowdfundingData : defaultProductsData;
}

function getTodayKey() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

function isNoSignalProduct(product) {
  return product?.id?.startsWith('no-signal-') || product?.category === 'none';
}

function matchesMonitoredBrand(product, monitoredBrands) {
  if (isNoSignalProduct(product)) return true;
  return monitoredBrands.some(brand =>
    product.brand === brand ||
    product.brand?.includes(brand) ||
    brand.includes(product.brand || '')
  );
}

function shouldApplyMonitoredBrandFilter() {
  return viewState.section === 'featured';
}

function resetSectionTransientState() {
  viewState.category = 'all';
  viewState.search = '';
  currentSearchKeyword = '';

  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';

  document.querySelectorAll('.filter-tab').forEach((tab, index) => {
    tab.classList.toggle('active', index === 0);
  });
}

function getEmptyStateMessage() {
  if (isCrowdfundingView() && crowdfundingLoadError) {
    return `众筹数据加载失败：${crowdfundingLoadError}`;
  }
  if (viewState.section === 'today') return '今日暂无视觉约束变化信号';
  if (viewState.section === 'featured') return '暂无达到精选阈值的产品';
  if (isCrowdfundingView()) return '暂无符合条件的众筹项目';
  return '暂无符合条件的产品';
}

function sortByCrowdfundingPriority(items) {
  const num = (value) => {
    const number = Number(value);
    return Number.isFinite(number) ? number : 0;
  };
  const timeValue = (product) => new Date(product.time || 0).getTime() || 0;

  return items.sort((a, b) => {
    const aKs = a.ksData || {};
    const bKs = b.ksData || {};
    return (num(b.score || b.visTotal) - num(a.score || a.visTotal)) ||
      (num(bKs.backersCount) - num(aKs.backersCount)) ||
      (num(bKs.percentFunded) - num(aKs.percentFunded)) ||
      ((bKs.state === 'live' ? 1 : 0) - (aKs.state === 'live' ? 1 : 0)) ||
      (timeValue(b) - timeValue(a));
  });
}

function updateCrowdfundingControls(enabled) {
  const filterTabs = document.getElementById('filterTabs');
  const sortBar = document.querySelector('.sort-bar');
  if (!filterTabs || !sortBar) return;

  if (enabled) {
    filterTabs.innerHTML = `
      <button class="filter-tab active" onclick="filterCategory(this, 'all')">全部</button>
      <button class="filter-tab" onclick="filterCategory(this, 'top_score')">高VIS</button>
      <button class="filter-tab" onclick="filterCategory(this, 'live')">进行中</button>
      <button class="filter-tab" onclick="filterCategory(this, 'successful')">已成功</button>
      <button class="filter-tab" onclick="filterCategory(this, 'staff_pick')">Staff Pick</button>
      <button class="filter-tab" onclick="filterCategory(this, 'high_backers')">高支持者</button>
      <button class="filter-tab" onclick="filterCategory(this, 'million')">百万美元</button>
      <button class="filter-tab" onclick="filterCategory(this, 'breakout')">高达成率</button>
      <button class="filter-tab" onclick="filterCategory(this, 'new_launch')">新近上线</button>
    `;

      <button class="sort-btn active" onclick="sortProducts('crowdfunding', this)" data-sort="crowdfunding">综合</button>
      <button class="sort-btn" onclick="sortProducts('funded', this)" data-sort="funded">达成率</button>
      <button class="sort-btn" onclick="sortProducts('backers', this)" data-sort="backers">支持者</button>
      <button class="sort-btn" onclick="sortProducts('days', this)" data-sort="days">上线天数</button>
    `;
    return;
  }

  if (defaultFilterHtml) filterTabs.innerHTML = defaultFilterHtml;
  if (defaultSortHtml) sortBar.innerHTML = defaultSortHtml;
}

function matchesCrowdfundingFilter(product, filter) {
  const ks = product.ksData || {};
  const score = Number(product.score || product.visTotal || 0);
  const backers = Number(ks.backersCount || 0);
  const pledged = Number(ks.usdPledged || 0);
  const funded = Number(ks.percentFunded || 0);
  const days = Number(ks.daysSinceLaunch || 0);

  if (filter === 'all') return true;
  if (filter === 'top_score') return score >= 80;
  if (filter === 'live' || filter === 'successful') return (ks.state || '') === filter;
  if (filter === 'staff_pick') return Boolean(ks.staffPick);
  if (filter === 'high_backers') return backers >= 5000;
  if (filter === 'million') return pledged >= 1000000;
  if (filter === 'breakout') return funded >= 1000;
  if (filter === 'new_launch') return days > 0 && days <= 30;
  return true;
}

// 统一渲染：根据 viewState 过滤、排序并渲染
function applyViewStateAndRender() {
  // 防御性检查：确保 brandsData.brands 存在
  if (!isCrowdfundingView() && (!brandsData || !Array.isArray(brandsData.brands))) {
    console.error('[BrandPulse] brandsData.brands 不可用');
    renderTimeline([]);
    updateStats(0);
    return;
  }

  productsData = getActiveProducts();
  let filtered = [...productsData];

  if (!isCrowdfundingView() && shouldApplyMonitoredBrandFilter()) {
    // 按监控品牌过滤
    const monitoredBrands = brandsData.brands
      .filter(b => b.monitored).map(b => b.name);
    filtered = filtered.filter(p => matchesMonitoredBrand(p, monitoredBrands));
  }

  // 按 section 过滤
  if (isCrowdfundingView()) {
    if (viewState.category !== 'all') {
      filtered = filtered.filter(p => matchesCrowdfundingFilter(p, viewState.category));
    }
  } else if (viewState.section === 'today') {
    const today = getTodayKey();
    filtered = filtered.filter(p => p.time && p.time.startsWith(today));
  } else if (viewState.section === 'featured') {
    filtered = filtered.filter(p => (p.score >= 75) || (p.visTotal >= 7));
  }
  // 按 category 过滤
  if (!isCrowdfundingView() && viewState.category !== 'all') {
    filtered = filtered.filter(p => p.category === viewState.category);
  }
  // 按 search 过滤
  if (viewState.search) {
    const kw = viewState.search.toLowerCase();
    filtered = filtered.filter(p => {
      return (p.title||'').toLowerCase().includes(kw) ||
             (p.summary||'').toLowerCase().includes(kw) ||
             (p.desc||'').toLowerCase().includes(kw) ||
             (p.brand||'').toLowerCase().includes(kw) ||
             (p.tags || []).some(tag => String(tag).toLowerCase().includes(kw));
    });
  }
  // 按 sortBy 排序
  if (isCrowdfundingView() && viewState.sortBy === 'crowdfunding') {
    sortByCrowdfundingPriority(filtered);
  } else if (viewState.sortBy === 'funded') {
    filtered.sort((a, b) => (b.ksData?.percentFunded || 0) - (a.ksData?.percentFunded || 0));
  } else if (viewState.sortBy === 'backers') {
    filtered.sort((a, b) => (b.ksData?.backersCount || 0) - (a.ksData?.backersCount || 0));
  } else if (viewState.sortBy === 'days') {
    filtered.sort((a, b) => (a.ksData?.daysSinceLaunch || 0) - (b.ksData?.daysSinceLaunch || 0));
  } else if (viewState.sortBy === 'time') {
    filtered.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
  } else if (viewState.sortBy === 'score') {
    filtered.sort((a, b) => (b.score || b.visTotal || 0) - (a.score || a.visTotal || 0));
  } else if (viewState.sortBy === 'brand') {
    filtered.sort((a, b) => (a.brand || '').localeCompare(b.brand || '', 'zh-CN'));
  }
  // 渲染
  renderTimeline(filtered);
  updateStats(filtered.length);
}

function filterCategory(btn, category) {
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  applyViewStateAndRender();
}

function filterByCategory(category) {
  const tabs = document.querySelectorAll('.filter-tab');
  tabs.forEach(tab => {
    if (tab.textContent.includes(getCategoryName(category).replace(/[^\u4e00-\u9fa5]/g, ''))) {
      filterCategory(tab, category);
    }
  });
}

async function switchSection(section, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const titles = { 'featured': '精选', 'all': '全部动态', 'today': '今日更新', 'crowdfunding': '众筹追踪' };
  document.getElementById('pageTitle').textContent = titles[section] || '精选';
  viewState.section = section;
  resetSectionTransientState();

  if (section === 'crowdfunding') {
    showSkeleton();
    await loadCrowdfundingProducts();
    updateCrowdfundingControls(true);
    viewState.sortBy = 'crowdfunding';
  } else {
    updateCrowdfundingControls(false);
    productsData = defaultProductsData;
    viewState.sortBy = section === 'featured' ? 'score' : 'time';
    resetSectionTransientState();
  }

  applyViewStateAndRender();
}

// ==================== 加载历史归档 ====================
let archiveLoaded = false;

async function loadArchive() {
  if (archiveLoaded) return;
  const btn = document.getElementById('loadArchiveBtn');
  const status = document.getElementById('archiveStatus');
  btn.textContent = '加载中...';
  btn.disabled = true;
  
  try {
    // 尝试加载归档文件列表
    const months = ['2026-05', '2026-04', '2026-03', '2026-02', '2026-01'];
    let totalLoaded = 0;
    
    for (const month of months) {
      try {
        const res = await fetch(`./products/archive/archive_${month}.json`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            productsData.push(...data);
            totalLoaded += data.length;
          }
        }
      } catch (e) {
        // 该月份无归档文件，跳过
      }
    }
    
    if (totalLoaded > 0) {
      archiveLoaded = true;
      applyViewStateAndRender();
      btn.textContent = `已加载 ${totalLoaded} 条历史数据`;
      btn.style.borderColor = 'var(--accent-green)';
      btn.style.color = 'var(--accent-green)';
      status.textContent = '历史归档数据已合并到当前列表';
    } else {
      btn.textContent = '暂无历史归档';
      btn.disabled = false;
      status.textContent = '还没有超过30天的归档数据';
    }
  } catch (e) {
    btn.textContent = '加载失败，点击重试';
    btn.disabled = false;
    status.textContent = '网络错误: ' + e.message;
  }
}

function addBrand() {
  const name = document.getElementById('newBrandName').value.trim();
  const category = document.getElementById('newBrandCategory').value;
  const type = document.getElementById('newBrandType').value.trim();
  
  if (!name) {
    alert('请输入品牌名称');

  // 检查重复品牌
  if (brandsData.brands.some(b => b.name === name)) {
    alert('品牌「' + name + '」已存在');
    return;
  }
  
  brandsData.brands.push({
    name: name,
    nameEn: name,
    category: category,
    type: type || '新品牌',
    monitored: true,
    officialSources: []
  });
  
  renderBrandList();
  renderBrandInlineList(); // 更新侧边栏内联品牌列表
  applyViewStateAndRender();
  closeAddBrandModal();
  updateSyncStatus('已修改，请保存');
  
  // 清空输入
  document.getElementById('newBrandName').value = '';
  document.getElementById('newBrandType').value = '';
}

// ==================== 统计更新 ====================
function updateStats(filteredCount) {
  if (isCrowdfundingView()) {
    const total = typeof filteredCount === 'number' ? filteredCount : crowdfundingData.length;
    const featured = crowdfundingData.filter(p => (p.score || p.visTotal || 0) >= 75).length;
    const live = crowdfundingData.filter(p => p.ksData?.state === 'live').length;
    const successful = crowdfundingData.filter(p => p.ksData?.state === 'successful').length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statFeatured').textContent = featured;
    document.getElementById('statBrands').textContent = live;
    document.getElementById('statMonitored').textContent = successful;
    document.getElementById('statTotalLabel').textContent = '众筹项目';
    document.getElementById('statFeaturedLabel').textContent = '高分项目';
    document.getElementById('statBrandsLabel').textContent = '进行中';
    document.getElementById('statMonitoredLabel').textContent = '已成功';
    const crowdfundingCount = document.getElementById('crowdfundingCount');
    if (crowdfundingCount) {
      crowdfundingCount.textContent = crowdfundingData.length;
      crowdfundingCount.style.display = crowdfundingData.length ? '' : 'none';
    }
    return;
  }

  // 如果传入了已过滤的数量，直接使用；否则重新计算
  let total;
  if (typeof filteredCount === 'number') {
    total = filteredCount;
  } else {
    const monitoredBrands = brandsData.brands
      .filter(b => b.monitored)
      .map(b => b.name);
    total = productsData.filter(product => {
      return monitoredBrands.some(brand =>
        product.brand === brand ||
        product.brand.includes(brand) ||
        brand.includes(product.brand)
      );
    }).length;
  }

  // 精选数：基于当前视图状态计算，保持阈值一致
  const monitoredBrands = brandsData.brands
    .filter(b => b.monitored)
    .map(b => b.name);
  const filteredProducts = productsData.filter(product => matchesMonitoredBrand(product, monitoredBrands));
  const featured = filteredProducts.filter(p => (p.score >= 75) || (p.visTotal >= 7)).length;
  const brands = brandsData.brands.length;
  const monitored = brandsData.brands.filter(b => b.monitored).length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statFeatured').textContent = featured;
  document.getElementById('statBrands').textContent = brands + '+';
  document.getElementById('statMonitored').textContent = monitored;
  document.getElementById('statTotalLabel').textContent = '视觉约束信号';
  document.getElementById('statFeaturedLabel').textContent = '精选推荐';
  document.getElementById('statBrandsLabel').textContent = '覆盖品牌';
  document.getElementById('statMonitoredLabel').textContent = '监控中';
  document.getElementById('featuredCount').textContent = featured;
  document.getElementById('allCount').textContent = defaultProductsData.length;
  const todayCount = document.getElementById('todayCount');
  if (todayCount) {
    const today = getTodayKey();
    const todayTotal = defaultProductsData.filter(p => p.time && p.time.startsWith(today)).length;
    todayCount.textContent = todayTotal;
    todayCount.style.display = todayTotal ? '' : 'none';
  }
}

}

initializeDashboard();
